<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha Catalográfica Gerada</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    margin: 0;
    background: linear-gradient(to bottom, #1e2a80, #9aa8d4, #ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #333;
  }

  .container {
    width: 90%;
    max-width: 700px;
    background-color: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    padding: 40px;
    text-align: center;
  }

  h1 {
    color: #1e2a80;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 30px;
    border-bottom: 2px solid #ccc;
    padding-bottom: 10px;
  }

  .ficha {
    background-color: rgba(245, 245, 245, 0.95);
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 20px;
    text-align: left;
    font-size: 15px;
    line-height: 1.8;
    color: #333;
    white-space: pre-wrap;
    margin-bottom: 25px;
  }

  .palavras-chave {
    line-height: 1.8;
    font-size: 15px;
    color: #333;
    margin-top: 10px;
  }

  .autor {
    margin-left: 5px;
  }

  .botoes {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
  }

  .botao {
    background-color: #4a2ac9;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 12px 25px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    display: inline-block;
  }

  .botao:hover {
    background-color: #3b23a3;
    transform: scale(1.03);
  }

  @media (max-width: 500px) {
    .container {
      padding: 25px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Ficha Catalográfica Gerada</h1>
    <div class="ficha">
      <div id="fichaCatalografica"></div>
    </div>

    <div class="botoes">
      <button class="botao" onclick="copiarTexto()">Copiar Ficha</button>
      <a href="obra.html" class="botao">Voltar ao Formulário</a>
    </div>
  </div>

<script>
function numeroRomano(num) {
  const romanos = [
    ['I','II','III','IV','V','VI','VII','VIII','IX','X'],
    ['X','XX','XXX','XL','L','LX','LXX','LXXX','XC','C'],
    ['C','CC','CCC','CD','D','DC','DCC','DCCC','CM','M']
  ];
  let resultado = '';
  let i = 0;
  while (num > 0) {
    const divisor = Math.pow(10, num.toString().length - 1);
    const digit = Math.floor(num / divisor);
    num -= digit * divisor;
    resultado += romanos[i][digit - 1] || '';
    i++;
  }
  return resultado;
}

window.onload = function() {
  const autores = JSON.parse(localStorage.getItem('autores')) || [];
  const orientador = localStorage.getItem('orientador') || '';
  const coorientador = localStorage.getItem('Coorientador') || '';
  const titulo_obra = localStorage.getItem('titulo_obra') || '';
  const cidade = localStorage.getItem('cidade') || '';
  const paginas = localStorage.getItem('paginas') || '';
  const ilustracoes = localStorage.getItem('ilustracoes') || '';
  const curso = localStorage.getItem('curso') || '';
  const nivel = localStorage.getItem('nivel') || '';
  const palavras_chave = localStorage.getItem('palavras_chave') || '';

  if (!titulo_obra || !autores.length || !paginas || !cidade) {
    alert("Faltam dados obrigatórios no formulário. Por favor, verifique os campos.");
    return;
  }

  let ficha = '';
  let numeroAutor = 1;

  if (autores.length > 0) {
    const primeiroAutor = autores[0].split(' ');
    ficha += `${primeiroAutor.join(' ')}\n`;
  }

  ficha += `${titulo_obra} – ${cidade}, ${new Date().getFullYear()}.\n\n`;
  ficha += `${paginas} p.: il., ${ilustracoes.toLowerCase()}.\n`;

  if (orientador) {
    ficha += `Orientador: ${orientador}.\n\n`;
  }

  let cursoSuperior = curso && curso !== "" ? "Curso Superior em " + curso : "Curso Superior";
  ficha += `TCC ${nivel}. (${cursoSuperior}) – Universidade Santo Amaro, ${new Date().getFullYear()}.\n`;
  ficha += `Bibliografia incluída.\n\n`;

  ficha += `Palavras-chave:\n`;
  let palavras = palavras_chave.split(',');
  palavras.forEach((palavra, index) => {
    ficha += `${numeroRomano(index + 1)}. ${palavra.trim()}\n`;
  });

  autores.slice(1).forEach((autor) => {
    ficha += `${numeroRomano(numeroAutor)}. ${autor}\n`;
    numeroAutor++;
  });

  if (coorientador) ficha += `${numeroRomano(numeroAutor)}. ${coorientador}\n`;
  if (orientador) ficha += `${numeroRomano(numeroAutor + 1)}. ${orientador}\n`;

  ficha += `${numeroRomano(numeroAutor + 2)}. Universidade Santo Amaro\n`;
  ficha += `${numeroRomano(numeroAutor + 3)}. Título.\n`;

  document.getElementById('fichaCatalografica').innerText = ficha;
};

function copiarTexto() {
  const fichaTexto = document.getElementById('fichaCatalografica').innerText;
  navigator.clipboard.writeText(fichaTexto).then(() => {
    alert("Ficha catalográfica copiada com sucesso!");
  }).catch((err) => {
    alert("Erro ao copiar: " + err);
  });
}
</script>
</body>
</html>
