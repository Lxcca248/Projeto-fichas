<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ficha Catalográfica - Dados Pessoais</title>
<style>
  body {
    margin: 0;
    font-family: "Poppins", Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c90, #cdd8f7);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  h1 {
    text-align: center;
    font-size: 22px;
    color: #1e3c90;
    margin-bottom: 30px;
  }

  form {
    display: flex;
    flex-direction: column;
  }

  input,
  select {
    padding: 12px 16px;
    border: none;
    border-radius: 50px;
    background: #fff;
    margin-bottom: 15px;
    font-size: 15px;
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.1);
    outline: none;
  }

  input:focus,
  select:focus {
    box-shadow: 0 0 5px #4a6eff;
  }

  button {
    background-color: #4b2ecf;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: background-color 0.3s;
  }

  button:hover {
    background-color: #3720a3;
  }

  @media (max-width: 480px) {
    .container {
      padding: 25px;
      width: 85%;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Formulário para Gerar Ficha Catalográfica</h1>
    <form id="dadosPessoaisForm">
      <input type="text" id="autores" placeholder="Nome completo do(s) autor(es)" required />
      <input type="text" id="orientador" placeholder="Orientador" required />

      <select id="orientador-titulacao">
        <option value="">Escolha a titulação</option>
        <option value="Esp.">Especialista</option>
        <option value="MBA.">MBA</option>
        <option value="Dr.">Dr.</option>
        <option value="Dra.">Dra.</option>
        <option value="Me.">Me.</option>
        <option value="Ma.">Ma.</option>
        <option value="MSc.">MSc.</option>
      </select>

      <input type="text" id="Coorientador" placeholder="Coorientador (opcional)" />

      <select id="coorientador-titulacao">
        <option value="">Escolha a titulação Coorientador</option>
        <option value="Esp.">Especialista</option>
        <option value="MBA.">MBA</option>
        <option value="Dr.">Dr.</option>
        <option value="Dra.">Dra.</option>
        <option value="Me.">Me.</option>
        <option value="Ma.">Ma.</option>
        <option value="MSc.">MSc.</option>
      </select>

      <button type="submit">Próximo</button>
    </form>
  </div>

<script>
document.getElementById('dadosPessoaisForm').addEventListener('submit', function(e) {
  e.preventDefault();

  localStorage.setItem('autores', document.getElementById('autores').value);
  localStorage.setItem('orientador', 
    document.getElementById('orientador-titulacao').value + document.getElementById('orientador').value
  );
  localStorage.setItem('Coorientador', 
    document.getElementById('coorientador-titulacao').value + document.getElementById('Coorientador').value
  );

  window.location.href = 'obra.html';
});
</script>
</body>
</html>
