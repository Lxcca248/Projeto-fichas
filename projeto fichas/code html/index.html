<html lang=pt-BR>
    <head>
        <meta charset=UTF-8>
        <meta name=viewport content="width=device-width, initial-scale=1.0">
        <title>Gerar Ficha Catalográfica</title>
        <style>
            body {
                background-image: url('imagens/fotos.jpg');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                color: #fff;
                font-family: Arial,sans-serif;
                margin: 0;
                padding: 0;
                background-color: #2c3e50
            }

            .container {
                max-width: 600px;
                margin: 50px auto;
                padding: 30px;
                background-color: rgba(0,0,0,0.7);
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5)
            }

            h1 {
                text-align: center;
                color: #fff;
                margin-bottom: 30px;
                font-size: 28px
            }

            label {
                color: #fff;
                font-weight: bold;
                margin-bottom: 5px;
                display: block
            }

            input,select,textarea,button {
                width: 100%;
                padding: 12px;
                margin: 8px 0;
                border: 1px solid #ddd;
                border-radius: 4px;
                background-color: #fff;
                font-size: 16px;
                color: #333
            }

            button {
                background-color: #4caf50;
                color: white;
                font-size: 18px;
                cursor: pointer;
                transition: background-color .3s ease
            }

            button:hover {
                background-color: #45a049
            }

            textarea {
                height: 100px;
                resize: vertical
            }

            #cidade-container {
                position: relative
            }

            #cidade-list {
                max-height: 150px;
                overflow-y: auto;
                position: absolute;
                z-index: 10;
                background-color: #000;
                width: 100%;
                border: 1px solid #030101;
                border-radius: 4px
            }

            #cidade-list div {
                padding: 10px;
                cursor: pointer
            }

            #cidade-list div:hover {
                background-color: #f0f0f0
            }

            @media(max-width: 600px) {
                .container {
                    padding:20px
                }

                h1 {
                    font-size: 24px
                }

                input,select,textarea,button {
                    font-size: 14px
                }

                button {
                    font-size: 16px
                }
            }

            .loading-container {
                position: fixed;
                top: 00px;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: rgba(0,0,0,0.8);
                z-index: 1000;
                color: #fff;
                font-family: Arial,sans-serif;
                font-size: 20px;
                flex-direction: column
            }

            .folha {
                position: absolute;
                width: 50px;
                height: 50px;
                background-color: #28a745;
                clip-path: polygon(50% 0,0% 100%,100% 100%);
                animation: folhaAnimada 3s ease-in-out infinite
            }

            @keyframes folhaAnimada {
                0% {
                    transform: translateX(0) translateY(0) rotate(0deg)
                }

                50% {
                    transform: translateX(200px) translateY(-200px) rotate(180deg)
                }

                100% {
                    transform: translateX(0) translateY(0) rotate(360deg)
                }
            }

            .progress-bar {
                width: 30%;
                height: 20px;
                background-color: #ddd;
                margin-top: 20px;
                border-radius: 10px;
                overflow: hidden;
                position: relative
            }

            .progress-bar span {
                display: block;
                height: 100%;
                background-color: #4caf50;
                width: 0;
                border-radius: 10px;
                position: absolute;
                top: 0;
                left: 0;
                transition: width .1s ease-in-out
            }
        </style>
    </head>
    <body>

        <div class=container>
            <h1>Formulário para Gerar Ficha Catalográfica</h1>
            <form id=fichaForm>
                <label for=autores>Nome completo do(s) autor(es) (separar autores por vírgula):</label>
                <input type=text id=autores required>
                <label for=orientador>Orientador:</label>
                <input type=text id=orientador required>
                <select name=orientador-titulacao id=orientador-titulacao>
                    <option value=" ">-- Escolha a titulação --</option>
                    <option value=Esp. >Especialista</option>
                    <option value=MBA. >Master in Business Administration (no Brasil ou no Exterior)</option>
                    <option value=Dra. >Doutora, com título nacional</option>
                    <option value=Dr. >Doutor, com título nacional</option>
                    <option value=Ma. >Mestra- Título concedido por instituição no Brasil. (Segundo ABL)</option>
                    <option value=Me. >Mestre- Título concedido por instituição no Brasil. (Segundo ABL)</option>
                    <option value=MSc. >Master of Science (Mestrado no Exterior)</option>
                </select>

                <label for=Coorientador>Coorientador (opcional):</label>
                <input type=text id=Coorientador>
                <select name=coorientador-titulacao id=coorientador-titulacao>
                    <option value=" ">-- Escolha a titulação --</option>
                    <option value=Esp. >Especialista</option>
                    <option value=MBA. >Master in Business Administration (no Brasil ou no Exterior)</option>
                    <option value=Dra. >Doutora, com título nacional</option>
                    <option value=Dr. >Doutor, com título nacional</option>
                    <option value=Ma. >Mestra- Título concedido por instituição no Brasil. (Segundo ABL)</option>
                    <option value=Me. >Mestre- Título concedido por instituição no Brasil. (Segundo ABL)</option>
                    <option value=MSc. >Master of Science (Mestrado no Exterior)</option>
                </select>
                
                <label for=titulo_obra>Título da obra:</label>
                <input type=text id=titulo_obra required>
                <label for=cidade>Cidade:</label>
                <div id=cidade-container>
                    <input type=text id=cidade onkeyup=filtrarCidades() placeholder="Digite a cidade">
                    <div id=cidade-list></div>
                </div>
                <label for=paginas>Páginas:</label>
                <input type=number id=paginas required>
                <label for=ilustracoes>Ilustrações (P&B ou Color):</label>
                <select id=ilustracoes required>
                    <option value=Color>Color</option>
                    <option value=P&B>P&B</option>
                </select>
                <label for=curso>Curso:</label>
                <input type=text id=curso required>
                <label for=nivel>Nível: (selecione a correta)</label>
                <select id=nivel required>
                    <option value="Graduação ">Graduação (TCC)</option>
                    <option value="Especialização ">Especialização (TCC)</option>
                    <option value="Mestrado (Dissertação)">Mestrado (Dissertação)</option>
                    <option value="Doutorado (Tese)">Doutorado (Tese)</option>
                </select>
                <label for=palavras_chave>Palavras-chave (3 termos, do geral ao específico):</label>
                <input type=text id=palavras_chave required>
                <label for=emails>Email(s) (de todos os autores, separados por vírgula):</label>
                <input type=text id=emails required placeholder="exemplo@dominio.com, outro@dominio.com">
                <button type=submit>Gerar Ficha Catalográfica</button>
            </form>

            <footer>
                <p>&copy; 2025 Todos os direitos reservados. Desenvolvido por Lucca Locoselli.</p>
                <p>
                  <a href="/sobre">Sobre</a> |
<a href="https://br.linkedin.com/in/lucca-fernandes-de-lima-locoselli-03b233214" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                </p>
              </footer>



        </div>
        <div class=loading-container id=loadingScreen style=display:none>
            <div class=folha></div>
            <div class=progress-bar>
                <span id=progress></span>
            </div>
            Gerando Ficha Catalográfica...


        </div>
        <script>
            const cidades = ["São Paulo", "Rio de Janeiro", "Belo Horizonte", "Brasília", "Curitiba", "Porto Alegre", "Salvador", "Recife", "Fortaleza", "Manaus", "Natal", "Goiânia", "Cuiabá", "Campo Grande", "Maceió", "Aracaju", "Vitória", "Belém", "Florianópolis", "João Pessoa", "Santos", "Campinas", "Sorocaba", "São Luís", "Maringá", "Niterói", "Londrina", "Ribeirão Preto", "São Bernardo do Campo", "Diadema", "Itaquaquecetuba", "Ponta Grossa", "Canoas", "Blumenau", "Maceió", "Uberlândia", "Betim"];
            function filtrarCidades() {
                const input = document.getElementById('cidade').value.toLowerCase();
                const lista = document.getElementById('cidade-list');
                lista.innerHTML = '';
                const cidadesFiltradas = cidades.filter(cidade => cidade.toLowerCase().includes(input));
                cidadesFiltradas.forEach(cidade => {
                    const div = document.createElement('div');
                    div.textContent = cidade;
                    div.onclick = function() {
                        document.getElementById('cidade').value = cidade;
                        lista.innerHTML = '';
                    }
                    ;
                    lista.appendChild(div);
                }
                );
            }
            document.getElementById('fichaForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const autores = document.getElementById('autores').value.split(',').map(nome => nome.trim());
                const orientador = document.getElementById('orientador').value;
                const orientadorTit = document.getElementById('orientador-titulacao').value;
                const Coorientador = document.getElementById('Coorientador').value;
                const coorientadorTit = document.getElementById('coorientador-titulacao').value;
                const orientadorComTitulacao = orientadorTit ? `${orientadorTit} ${orientador}` : orientador;
                const coorientadorComTitulacao = coorientadorTit ? `${coorientadorTit} ${Coorientador}` : Coorientador;
                const titulo_obra = document.getElementById('titulo_obra').value;
                const cidade = document.getElementById('cidade').value;
                const paginas = document.getElementById('paginas').value;
                const ilustracoes = document.getElementById('ilustracoes').value;
                const curso = document.getElementById('curso').value;
                const nivel = document.getElementById('nivel').value;
                const palavras_chave = document.getElementById('palavras_chave').value;
                const emails = document.getElementById('emails').value.split(',').map(email => email.trim());
                localStorage.setItem('autores', JSON.stringify(autores));
                localStorage.setItem('orientador', orientadorComTitulacao);
                localStorage.setItem('Coorientador', coorientadorComTitulacao);
                localStorage.setItem('titulo_obra', titulo_obra);
                localStorage.setItem('cidade', cidade);
                localStorage.setItem('paginas', paginas);
                localStorage.setItem('ilustracoes', ilustracoes);
                localStorage.setItem('curso', curso);
                localStorage.setItem('nivel', nivel);
                localStorage.setItem('palavras_chave', palavras_chave);
                localStorage.setItem('emails', JSON.stringify(emails));
                document.getElementById('loadingScreen').style.display = 'flex';
                let progress = 0;
                const interval = setInterval(function() {
                    progress += 2;
                    document.getElementById('progress').style.width = progress + '%';
                    if (progress >= 100) {
                        clearInterval(interval);
                        setTimeout(function() {
                            document.getElementById('loadingScreen').style.display = 'none';
                            window.location.href = 'ficha_resultado.html';
                        }, 1000);
                    }
                }, 100);
            });
        </script>
    </body>
</html>
