<!DOCTYPE html>
<html lang=pt-BR>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width, initial-scale=1.0">
<title>Ficha Catalográfica Gerada</title>
<style>body{font-family:Arial,sans-serif;font-size:11px}.espaco-entre-caracteres{letter-spacing:3px}.palavras-chave{white-space:nowrap;line-height:1.8;font-size:16px;color:#333;margin-bottom:20px}body{background-color:#f4f4f9;font-family:'Arial',sans-serif;margin:0;padding:0;color:#333;display:flex;justify-content:center;align-items:center;height:100vh}.container{width:100%;max-width:700px;padding:40px;background-color:#fff;border:1px solid #ccc;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:left;display:flex;flex-direction:column;align-items:center;background-image:url('imagens/ficha.jpg');background-size:cover;background-position:center;background-repeat:no-repeat}h1{color:#2c3e50;font-size:28px;font-weight:bold;text-align:center;text-transform:uppercase;margin-bottom:40px;border-bottom:2px solid #ccc;padding-bottom:10px}.ficha{white-space:pre-wrap;line-height:1.8;font-size:16px;color:#333;width:100%;padding:20px;border:1px solid #ccc;border-radius:5px;background-color:rgba(249,249,249,0.8);margin-bottom:30px;box-sizing:border-box}.botao-voltar,.botao-copiar{display:inline-block;margin-top:20px;padding:12px 20px;background-color:#4caf50;color:white;text-decoration:none;border-radius:4px;font-size:16px;cursor:pointer;transition:background-color .3s ease}.botao-voltar:hover,.botao-copiar:hover{background-color:#45a049}.conteudo{display:inline-block;padding-left:20px}.palavras-chave{white-space:pre-wrap;line-height:1.8;font-size:16px;color:#333;margin-bottom:20px}.autor{margin-left:5px}</style>
</head>
<body>
<div class=container>
<h1>Ficha Catalográfica Gerada</h1>
<div class=ficha>
<div class=conteudo id=fichaCatalografica></div>
</div>
<button class=botao-copiar onclick=copiarTexto()>Copiar Ficha Catalográfica</button>
<a href=index.html class=botao-voltar>Voltar ao Formulário</a>
</div>
<script>function numeroRomano(num){const romanos=[['I','II','III','IV','V','VI','VII','VIII','IX','X'],['X','XX','XXX','XL','L','LX','LXX','LXXX','XC','C'],['C','CC','CCC','CD','D','DC','DCC','DCCC','CM','M']];let resultado='';let i=0;while(num>0){const divisor=Math.pow(10,num.toString().length-1);const digit=Math.floor(num/divisor);num-=digit*divisor;resultado+=romanos[i][digit-1]||'';i++;}
return resultado;}
window.onload=function(){const autores=JSON.parse(localStorage.getItem('autores'))||[];const orientador=localStorage.getItem('orientador')||'';const coorientador=localStorage.getItem('Coorientador')||'';const titulo_obra=localStorage.getItem('titulo_obra')||'';const cidade=localStorage.getItem('cidade')||'';const paginas=localStorage.getItem('paginas')||'';const ilustracoes=localStorage.getItem('ilustracoes')||'';const curso=localStorage.getItem('curso')||'';const nivel=localStorage.getItem('nivel')||'';const palavras_chave=localStorage.getItem('palavras_chave')||'';if(!titulo_obra||!autores.length||!paginas||!cidade){alert("Faltam dados obrigatórios no formulário. Por favor, verifique os campos.");return;}
let ficha='';let numeroAutor=1;if(autores.length>0){const primeiroAutor=autores[0].split(' ');if(autores.length>=3){const sigla=primeiroAutor.pop();ficha+=`${sigla}.${primeiroAutor.join(' ')}[et al]...\n`;}else{ficha+=`${primeiroAutor.join(' ')}\n`;}}
ficha+=`<div class="conteudo">`;ficha+=`${titulo_obra}-${cidade},${new Date().getFullYear()}.\n\n`;ficha+=`${paginas}p.:il.,${ilustracoes.toLowerCase()}.\n`;if(orientador){const nomeOrientador=orientador.split(' ');ficha+=`Orientador:${nomeOrientador.join(' ')}.&nbsp;\n\n`;}
let cursoSuperior=curso&&curso!==""?"Curso Superior em "+curso:"Curso Superior";ficha+=`TCC ${nivel}.(${cursoSuperior})-Universidade Santo Amaro,${new Date().getFullYear()}.\n`;ficha+=`Bibliografia incluída.\n\n`;ficha+=`<div class="palavras-chave">`;let palavras=palavras_chave.split(',');palavras.forEach((palavra,index)=>{ficha+=`${numeroRomano(index+1)}.&nbsp;&nbsp;${palavra.trim()}.`;});ficha+=`</div>`;autores.slice(1).forEach((autor)=>{const nomeAutor=autor.split(' ');ficha+=`${numeroRomano(numeroAutor)}.<span class="autor">${nomeAutor.pop()},${nomeAutor.join(' ')}.</span>`;numeroAutor++;});if(coorientador){const nomeCoorientador=coorientador.split('');ficha+=`${nomeCoorientador.join('')}&nbsp;`;}
if(orientador){const nomeOrientador=orientador.split(' ');ficha+=`${numeroRomano(numeroAutor)}.<span class="autor">${nomeOrientador.pop()},${nomeOrientador.join(' ')}</span>`;numeroAutor++;}
ficha+=`${numeroRomano(numeroAutor)}.Universidade Santo Amaro`;numeroAutor++;ficha+=`${numeroRomano(numeroAutor)}.Título.`;ficha+=`</div>`;const fichaElement=document.getElementById('fichaCatalografica');fichaElement.innerHTML=ficha;}
function copiarTexto(){const fichaTexto=document.getElementById('fichaCatalografica').innerText;navigator.clipboard.writeText(fichaTexto).then(function(){alert("Texto copiado com sucesso!");}).catch(function(err){alert("Erro ao copiar texto: "+err);});}</script>
</body>
</html>
